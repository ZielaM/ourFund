# Publishes the Docker image to the GitHub Container Registry when a release is published.
# A release tagged v1.2.3 becomes ghcr.io/<owner>/<repo>:1.2.3, :1.2 and :latest.
# After the very first release, check that the package is public (repository page, Packages,
# Package settings, Change visibility): a new package may start out private.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Publish the Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Sign in to the GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the image name and tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          # A pre-release (v1.2.3-rc.1) gets its own tag only and never moves "latest".
          flavor: |
            latest=auto

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
