name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint, format, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck

  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ourfund
          POSTGRES_PASSWORD: ourfund
          POSTGRES_DB: ourfund
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ourfund -d ourfund"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://ourfund:ourfund@localhost:5432/ourfund_test?schema=public
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ourfund
          POSTGRES_PASSWORD: ourfund
          POSTGRES_DB: ourfund
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ourfund -d ourfund"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      E2E_DATABASE_URL: postgresql://ourfund:ourfund@localhost:5432/ourfund_e2e?schema=public
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Check the running application
        run: |
          curl --fail --silent --show-error http://localhost:3000/api/health
          curl --fail --silent --show-error --output /dev/null http://localhost:3000/
      - name: Check that password hashing works inside the image
        run: >-
          docker compose exec -T app node -e
          "require('@node-rs/argon2').hash('smoke-test').then((h) => { if (!h.startsWith('\$argon2id')) process.exit(1) })"
      - name: Show logs
        if: ${{ failure() }}
        run: docker compose logs --no-color
      - name: Stop the stack
        if: ${{ always() }}
        run: docker compose down --volumes
